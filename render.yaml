services:
  # 1. La Base de Datos PostgreSQL para Chatwoot
  - name: chatwoot-db
    type: postgres # <-- CORRECCIÓN: Tipo de servicio específico para Postgres
    plan: starter

  # 2. El Servidor Redis para trabajos en segundo plano
  - name: chatwoot-redis
    type: redis # <-- CORRECCIÓN: Tipo de servicio específico para Redis
    plan: starter

  # 3. La Aplicación Web Principal de Chatwoot
  - name: chatwoot-app
    type: web
    plan: starter
    env: docker
    repo: https://github.com/chatwoot/chatwoot
    branch: develop
    dockerfilePath: ./Dockerfile.ce
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgres
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: chatwoot-app
          property: externalUrl # <-- CORRECCIÓN: Propiedad correcta para la URL

    # Comando para preparar la base de datos la primera vez
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"
