databases:
  - name: chatwoot-db
    plan: free # <-- CORRECCIÓN: Cambiado de 'starter' a 'free'
    databaseName: chatwoot_production
    user: chatwoot

services:
  # 1. El Servidor Redis para trabajos en segundo plano
  - name: chatwoot-redis
    type: redis
    plan: free # <-- Cambiado a 'free' también para consistencia
    ipAllowList: []

  # 2. La Aplicación Web Principal de Chatwoot
  - name: chatwoot-app
    type: web
    plan: free # <-- Cambiado a 'free' para empezar sin costos
    env: docker
    repo: https://github.com/chatwoot/chatwoot
    branch: develop
    dockerfilePath: ./Dockerfile.ce
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: chatwoot-app
          property: url

    # Comando para preparar la base de datos la primera vez
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"
