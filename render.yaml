databases:
  - name: chatwoot-db
    plan: free
    databaseName: chatwoot_production
    user: chatwoot

services:
  # 1. El Servidor Redis
  - name: chatwoot-redis
    type: redis
    plan: free
    ipAllowList: []

  # 2. La Aplicación Web Principal de Chatwoot
  - name: chatwoot-app
    type: web
    plan: free
    env: docker
    repo: https://github.com/chatwoot/chatwoot
    branch: develop
    dockerfilePath: ./Dockerfile.ce
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      # La FRONTEND_URL la configuraremos manualmente después
