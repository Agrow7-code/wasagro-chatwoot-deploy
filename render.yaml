databases:
  - name: chatwoot-db
    plan: starter
    databaseName: chatwoot_production
    user: chatwoot

services:
  # 1. El Servidor Redis para trabajos en segundo plano
  - name: chatwoot-redis
    type: redis
    plan: starter
    ipAllowList: [] # <-- CORRECCIÓN 1: Permite acceso desde cualquier IP (para empezar)

  # 2. La Aplicación Web Principal de Chatwoot
  - name: chatwoot-app
    type: web
    plan: starter
    env: docker
    repo: https://github.com/chatwoot/chatwoot
    branch: develop
    dockerfilePath: ./Dockerfile.ce
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: chatwoot-app
          property: url # <-- CORRECCIÓN 2: La propiedad correcta es 'url'

    # Comando para preparar la base de datos la primera vez
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"
