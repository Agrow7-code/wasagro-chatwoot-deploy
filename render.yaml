services:
  # 1. La Base de Datos PostgreSQL para Chatwoot
  - name: chatwoot-db
    type: pserv
    runtime: postgres
    plan: starter

  # 2. El Servidor Redis para trabajos en segundo plano
  - name: chatwoot-redis
    type: pserv
    runtime: redis
    plan: starter

  # 3. La Aplicación Web Principal de Chatwoot
  - name: chatwoot-app
    type: web
    plan: starter
    env: docker
    repo: https://github.com/chatwoot/chatwoot
    branch: develop # O la rama que prefieras, 'develop' suele ser la más actualizada
    dockerfilePath: ./Dockerfile.ce
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: chatwoot-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: chatwoot-app
          property: url

    # Comando para preparar la base de datos la primera vez
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"
